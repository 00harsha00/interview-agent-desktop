<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: matches the in-app "IA" mini-bar logo (indigo→violet gradient, white mark) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <text x="512" y="512" dy="0.36em" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif" font-weight="900"
        font-size="400" letter-spacing="-18" fill="#ffffff">IA</text>
</svg>
